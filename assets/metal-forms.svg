<svg xmlns="http://www.w3.org/2000/svg" width="700" height="700" viewBox="0 0 700 700" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Sculptural metal components</title>
  <desc id="description">An original illustration of machined silver and charcoal components, showing a flanged housing, a cylindrical sleeve, and a metal ring on a warm neutral background.</desc>
  <defs>
    <linearGradient id="base" x1="110" y1="25" x2="555" y2="635" gradientUnits="userSpaceOnUse"><stop stop-color="#e6e5dd"/><stop offset="1" stop-color="#d2d1c7"/></linearGradient>
    <linearGradient id="steel" x1="270" y1="167" x2="528" y2="493" gradientUnits="userSpaceOnUse"><stop stop-color="#f2f2ed"/><stop offset=".22" stop-color="#b8c0bd"/><stop offset=".42" stop-color="#e2e5df"/><stop offset=".63" stop-color="#778582"/><stop offset="1" stop-color="#c0c6bf"/></linearGradient>
    <linearGradient id="top" x1="220" y1="146" x2="448" y2="398" gradientUnits="userSpaceOnUse"><stop stop-color="#f6f6f0"/><stop offset=".44" stop-color="#c7ceca"/><stop offset=".78" stop-color="#8c9993"/><stop offset="1" stop-color="#bdc8bf"/></linearGradient>
    <linearGradient id="dark" x1="177" y1="233" x2="397" y2="462" gradientUnits="userSpaceOnUse"><stop stop-color="#788881"/><stop offset=".45" stop-color="#3f514b"/><stop offset="1" stop-color="#182724"/></linearGradient>
    <linearGradient id="sleeve" x1="464" y1="119" x2="587" y2="247" gradientUnits="userSpaceOnUse"><stop stop-color="#d8ded7"/><stop offset=".3" stop-color="#f3f4e9"/><stop offset=".63" stop-color="#929f96"/><stop offset="1" stop-color="#455a4f"/></linearGradient>
    <linearGradient id="ring" x1="450" y1="427" x2="587" y2="579" gradientUnits="userSpaceOnUse"><stop stop-color="#8a938b"/><stop offset=".34" stop-color="#cfd1c6"/><stop offset=".54" stop-color="#f4f2e7"/><stop offset=".74" stop-color="#9caa9c"/><stop offset="1" stop-color="#44594b"/></linearGradient>
    <radialGradient id="hole"><stop stop-color="#192b27"/><stop offset=".74" stop-color="#263a31"/><stop offset="1" stop-color="#55695c"/></radialGradient>
    <filter id="shadow" x="-60%" y="-60%" width="220%" height="250%"><feGaussianBlur stdDeviation="17"/></filter>
    <filter id="small-shadow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" stroke="#657369" stroke-opacity=".055"/></pattern>
  </defs>
  <rect x="20" y="20" width="660" height="660" rx="330" fill="url(#base)"/>
  <rect x="20" y="20" width="660" height="660" rx="330" fill="url(#grid)"/>
  <circle cx="350" cy="350" r="300" stroke="#a6ada1" stroke-opacity=".23"/>
  <circle cx="350" cy="350" r="262" stroke="#a6ada1" stroke-opacity=".16" stroke-dasharray="3 8"/>
  <path d="M59 350h19m544 0h19M350 59v19m0 544v19" stroke="#7f8b7e" stroke-opacity=".5"/>
  <ellipse cx="321" cy="519" rx="184" ry="49" fill="#2a3728" opacity=".25" filter="url(#shadow)"/>
  <ellipse cx="522" cy="292" rx="65" ry="30" fill="#2a3728" opacity=".21" filter="url(#small-shadow)"/>
  <ellipse cx="511" cy="577" rx="89" ry="30" fill="#2a3728" opacity=".2" filter="url(#small-shadow)"/>
  <!-- Hollow sleeve, with an open bore and turned edges. -->
  <g transform="rotate(-22 520 230)">
    <path d="M459 161c0-25 27-45 61-45s61 20 61 45v118c0 25-27 45-61 45s-61-20-61-45z" fill="url(#sleeve)"/>
    <ellipse cx="520" cy="161" rx="61" ry="45" fill="url(#top)" stroke="#e9ece2" stroke-width="2"/>
    <ellipse cx="520" cy="161" rx="39" ry="29" fill="url(#hole)"/>
    <path d="M481 161c0 13 17 25 39 25s39-12 39-25" stroke="#84948a" stroke-width="3"/>
    <path d="M461 270c8 22 29 32 59 32s51-10 59-32M461 276c8 22 29 32 59 32s51-10 59-32" stroke="#65786a" stroke-opacity=".6" stroke-width="1"/>
    <path d="M471 185v89" stroke="#f7f8ef" stroke-opacity=".7" stroke-width="3"/>
    <path d="M575 185v89" stroke="#3a5144" stroke-opacity=".5" stroke-width="3"/>
  </g>
  <!-- Large flanged housing: the extrusion, top face and recessed centre. -->
  <path d="m116 340 38-87 110-63 99-8 117 84 15 102-59 84-114 54-115-7-74-70z" fill="url(#dark)"/>
  <path d="m116 317 38-87 110-63 99-8 117 84 15 102-59 84-114 54-115-7-74-70z" fill="url(#steel)" stroke="#7a8d7f" stroke-width="1.5"/>
  <path d="m116 317 38-87 110-63 99-8 117 84 15 102-59 84-114 54-115-7-74-70z" stroke="#f9faf0" stroke-opacity=".55" stroke-width="4"/>
  <path d="m116 317 17 66 74 70 115 7 114-54 59-84" stroke="#293f33" stroke-opacity=".3" stroke-width="2"/>
  <path d="m133 406 74 70 115 7 114-54 59-84" stroke="#c7d0c0" stroke-opacity=".5" stroke-width="2"/>
  <g transform="rotate(-27 304 311)">
    <ellipse cx="304" cy="317" rx="127" ry="103" fill="url(#dark)"/>
    <path d="M177 283c0-57 57-103 127-103s127 46 127 103v34c0 57-57 103-127 103s-127-46-127-103z" fill="url(#steel)"/>
    <ellipse cx="304" cy="283" rx="127" ry="103" fill="url(#top)" stroke="#eff2e5" stroke-width="2"/>
    <ellipse cx="304" cy="283" rx="86" ry="69" fill="url(#hole)" stroke="#697e6c" stroke-width="3"/>
    <path d="M218 283c0 37 39 63 86 63s86-26 86-63" stroke="#809682" stroke-width="7"/>
    <path d="M229 286c12 19 40 30 75 30s63-11 75-30" stroke="#1a2e24" stroke-width="14"/>
    <ellipse cx="304" cy="283" rx="119" ry="96" stroke="#6e8572" stroke-opacity=".28" stroke-width="1"/>
    <ellipse cx="304" cy="283" rx="112" ry="90" stroke="#6e8572" stroke-opacity=".24" stroke-width="1"/>
    <ellipse cx="304" cy="283" rx="104" ry="83" stroke="#6e8572" stroke-opacity=".25" stroke-width="1"/>
    <path d="M194 321c22 47 85 73 147 53" stroke="#e5ecda" stroke-opacity=".65" stroke-width="2"/>
  </g>
  <!-- Bolt bores sit in the flange rather than suggesting a functional assembly. -->
  <g fill="#3c5141" stroke="#cbd3c3" stroke-width="3">
    <ellipse cx="168" cy="296" rx="13" ry="10" transform="rotate(-27 168 296)"/>
    <ellipse cx="258" cy="194" rx="13" ry="10" transform="rotate(-27 258 194)"/>
    <ellipse cx="444" cy="274" rx="13" ry="10" transform="rotate(-27 444 274)"/>
    <ellipse cx="409" cy="412" rx="13" ry="10" transform="rotate(-27 409 412)"/>
    <ellipse cx="255" cy="457" rx="13" ry="10" transform="rotate(-27 255 457)"/>
    <ellipse cx="152" cy="388" rx="13" ry="10" transform="rotate(-27 152 388)"/>
  </g>
  <!-- Machined ring, raised slightly from the plane. -->
  <g transform="rotate(-25 510 510)">
    <path d="M414 495c0-37 43-68 96-68s96 31 96 68v21c0 37-43 68-96 68s-96-31-96-68z" fill="url(#ring)"/>
    <ellipse cx="510" cy="495" rx="96" ry="68" fill="url(#ring)" stroke="#dde1d2" stroke-width="2"/>
    <ellipse cx="510" cy="495" rx="61" ry="43" fill="#b7bcaa"/>
    <path d="M449 495c0 24 27 43 61 43s61-19 61-43v13c0 24-27 43-61 43s-61-19-61-43z" fill="#546e56"/>
    <ellipse cx="510" cy="495" rx="88" ry="62" stroke="#667c61" stroke-opacity=".35"/>
    <ellipse cx="510" cy="495" rx="79" ry="56" stroke="#f5f5e6" stroke-opacity=".7"/>
    <path d="M418 513c14 32 55 50 99 48" stroke="#f0f1df" stroke-opacity=".6" stroke-width="2"/>
  </g>
  <!-- Quiet drafting annotations and a single copper datum. -->
  <path d="M520 368h71v49" stroke="#7d887b" stroke-width="1"/>
  <circle cx="520" cy="368" r="3" fill="#cf5b31"/>
  <path d="M75 507h79m-79-5v10m79-10v10" stroke="#7d887b" stroke-width="1"/>
  <text x="75" y="531" fill="#667263" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="2">FORM / PRECISION</text>
  <circle cx="602" cy="123" r="7" fill="#cf5b31"/>
  <text x="90" y="105" fill="#667263" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="2.5">DZS — METAL STUDY 01</text>
</svg>
